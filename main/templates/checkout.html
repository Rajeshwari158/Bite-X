<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f8f8f8;
        }

        /* HEADER */
        .header {
            background: #6676a4;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .btn {
            background: white;
            color: #6676a4;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* CONTAINER */
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .food-name {
            font-size: 18px;
            font-weight: 500;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        /* TOTAL */
        .total-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .total-box h3 {
            margin-bottom: 20px;
        }

        /* BUTTON */
        .place-btn {
            background:#6676a4;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .place-btn:hover {
            opacity: 0.9;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            margin-top: 50px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- 🔥 HEADER -->
<div class="header">
    <h2>🧾 Checkout</h2>
    <a href="/cart/"><button class="btn">⬅ Back</button></a>
</div>

<div class="container">

{% if foods %}
    <!-- ITEMS -->
    {% for food in foods %}
    <div class="card">
        <div class="food-name">{{ food.name }}</div>
        <div class="price">₹{{ food.price }}</div>
    </div>
    {% endfor %}

    <!-- TOTAL -->
    <div class="total-box">
        <h3>Total Amount: ₹{{ total }}</h3>

        <form method="POST">
            {% csrf_token %}
            <button class="place-btn">Place Order 🚀</button>
        </form>
    </div>

{% else %}
    <div class="empty">
        No items to checkout 😢
        <br><br>
        <a href="/"><button class="btn">Go to Menu</button></a>
    </div>
{% endif %}

</div>

</body>
</html>
